name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t stundenerfassung:ci .
      - name: Container starten und prüfen
        run: |
          docker run -d --name se -p 3000:3000 stundenerfassung:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok"'
          curl -fsS -o /dev/null http://localhost:3000/login
          docker logs se
